
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENPARK | Loading</title>
  <link rel="stylesheet" href="loading.css">
  <script src="loading.js" defer></script>
</head>
<body>
  <main class="loader">
    <div class="brand">GEN<span>PARK</span></div>
    <p class="subtitle">YOUR SMART PARKING EXPERIENCE</p>

    <div class="road">
      <div class="road-line"></div>

      <div class="car car-one">
        <span class="car-body">🚙</span>
      </div>

      <div class="car car-two">
        <span class="car-body">🚗</span>
      </div>
    </div>

    <h1>Finding your parking space</h1>
    <p class="message">Preparing your smart journey...</p>

    <div class="progress">
      <div class="progress-fill"></div>
    </div>

    <p class="percentage">LOADING <span id="percent">0%</span></p>
  </main>
</body>
</html>
